services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geo
    volumes:
      - ./sql/schema/geo.sql:/docker-entrypoint-initdb.d/99-geo.sql

  node1:
    image: geo-service-demo
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo
    depends_on:
      - postgres
